<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Perfumes - AMAVI</title>
  <link rel="icon" href="/Perfumes-AMAVI/assets/img/LOGOAMAVI.png" />
  <link href="/Perfumes-AMAVI/assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- 🔸 CABECERA -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/Perfumes-AMAVI/">AMAVI</a>
      <nav class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="/Perfumes-AMAVI/">Inicio</a></li>
          <li><a href="/Perfumes-AMAVI/views/products.html" class="active">Catálogo</a></li>
          <li><a href="/Perfumes-AMAVI/views/personalizar.html">Personalizar</a></li>
          <li><a href="/Perfumes-AMAVI/views/login.html">Ingresar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 CATÁLOGO -->
  <main class="wrap" style="padding:80px 0;">
    <h2 class="center">Catálogo de Perfumes</h2>
    <p class="center text-muted">Explora nuestras fragancias exclusivas para cada estilo.</p>

    <div id="productGrid" class="products-grid" style="margin-top:40px;"></div>
  </main>

  <!-- 🔸 PIE DE PÁGINA -->
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes personalizados para cada esencia.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🔸 SCRIPT -->
  <script src="/Perfumes-AMAVI/assets/js/app.js"></script>
  <script>
    const grid = document.getElementById("productGrid");

    // Cargar perfumes desde app.js
    if (typeof perfumes !== "undefined") {
      grid.innerHTML = perfumes.map(p => `
        <div class="product-card">
          <img src="/Perfumes-AMAVI/assets/img/${p.image}" alt="${p.name}" />
          <h3>${p.name}</h3>
          <p class="text-muted">${p.notes}</p>
          <a class="btn-secondary" href="/Perfumes-AMAVI/views/product.html?id=${p.id}">Ver más</a>
        </div>
      `).join("");
    } else {
      grid.innerHTML = "<p class='center text-muted'>No hay productos disponibles.</p>";
    }
  </script>
</body>
</html>
