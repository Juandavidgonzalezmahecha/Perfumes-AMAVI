<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Perfumes - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <!-- 🔸 HEADER -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html" class="active">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="user-info"></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 CONTENIDO PRINCIPAL -->
  <main class="container" style="padding:60px 0;">
    <h2 class="center">Catálogo de Perfumes</h2>
    <p class="center text-muted">Explora nuestras fragancias exclusivas para cada estilo</p>
    <div id="productGrid" class="products-grid" style="margin-top:40px;"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>

  <script type="module">
    import { auth } from "../assets/js/firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    const userInfo = document.getElementById("user-info");

    onAuthStateChanged(auth, user => {
      if (user) {
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        userInfo.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" alt="Foto de perfil" style="width:32px;height:32px;border-radius:50%;">
            <span>${name}</span>
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await signOut(auth);
          alert("👋 Sesión cerrada");
          window.location.href = "../index.html";
        });
      } else {
        userInfo.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }
    });

    // Mostrar productos
    const grid = document.getElementById("productGrid");
    if (typeof perfumes !== "undefined") {
      grid.innerHTML = perfumes.map(p => `
        <div class="card">
          <img src="../assets/img/${p.image}" alt="${p.name}" />
          <h3>${p.name}</h3>
          <p class="text-muted">${p.notes}</p>
          <p class="price">$${p.price.toLocaleString()}</p>
          <button class="btn-primary" onclick="location.href='product.html?id=${p.id}'">Ver más</button>
        </div>
      `).join("");
    } else {
      grid.innerHTML = "<p class='center text-muted'>No hay productos disponibles.</p>";
    }
  </script>
</body>
</html>
