<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Perfumes - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- 🔸 HEADER -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul id="nav-links">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html" class="active">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-section"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:60px 0;">
    <h2 class="center">Catálogo de Perfumes</h2>
    <p class="center text-muted">Explora nuestras fragancias exclusivas</p>

    <!-- 🔹 SELECTOR DE TAMAÑO (ML) -->
    <div class="center" style="margin-top:20px;">
      <label for="sizeSelector" class="text-muted" style="margin-right:8px;">
        Selecciona el tamaño del frasco:
      </label>
      <select id="sizeSelector" style="padding:8px;border-radius:8px;">
        <option value="5">5 ml - $5.000</option>
        <option value="10">10 ml - $10.000</option>
        <option value="50">50 ml - $30.000</option>
        <option value="100">100 ml - $50.000</option>
      </select>
    </div>

    <div id="productGrid" class="products-grid" style="margin-top:40px;"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🟦 APP GENERAL (contador carrito, etc.) -->
  <script type="module" src="../assets/js/app.js"></script>

  <!-- 🟧 LÓGICA DE PRODUCTS: tamaño + precios dinámicos + addToCart -->
  <script type="module">
    import { db, auth, logoutUser, isAdmin } from "../assets/js/firebase.js";
    import {
      addToCart,
      SIZE_PRICES,
      getSelectedSize,
      setSelectedSize,
      updateCartCount
    } from "../assets/js/app.js";

    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const authSection = document.getElementById("auth-section");
    const grid = document.getElementById("productGrid");
    const sizeSelector = document.getElementById("sizeSelector");

    let productsData = {};

    /* -----------------------------------------
       🔹 CONTROL DE USUARIO Y ADMIN
    ------------------------------------------*/
    onAuthStateChanged(auth, async user => {
      if (user) {
        const admin = await isAdmin(user.uid);
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        authSection.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" alt="foto" class="user-photo">
            <span>${name}</span>
            ${admin ? `<a href="admin.html" class="btn-ghost">Administrar</a>` : ""}
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "../index.html";
        });

      } else {
        authSection.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }

      // Asegurar contador de carrito correcto
      updateCartCount();
    });

    /* -----------------------------------------
       🔹 ESCUCHA DE PRODUCTOS EN REALTIME
    ------------------------------------------*/
    const productsRef = ref(db, "products");

    onValue(productsRef, (snap) => {
      productsData = snap.val() || {};
      renderProductsGrid();
    });

    /* -----------------------------------------
       🔹 RENDER GRID SEGÚN TAMAÑO SELECCIONADO
    ------------------------------------------*/
    function renderProductsGrid() {
      const sizeMl = getSelectedSize();
      const unitPrice = SIZE_PRICES[sizeMl] || 5000;

      // sincronizar select con el valor
      sizeSelector.value = String(sizeMl);

      const entries = Object.entries(productsData)
        .filter(([, p]) => p.active !== false);

      if (!entries.length) {
        grid.innerHTML = `<p class="center text-muted">No hay productos disponibles.</p>`;
        return;
      }

      grid.innerHTML = entries.map(([id, p]) => `
        <div class="card">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="text-muted">${p.notes}</p>
          <p class="price">
            $${unitPrice.toLocaleString()} — ${sizeMl} ml
          </p>
          <button class="btn-primary add-to-cart" data-id="${id}">
            Agregar al carrito
          </button>
        </div>
      `).join("");

      // Asignar eventos a botones "Agregar al carrito"
      grid.querySelectorAll(".add-to-cart").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const p = productsData[id];
          const currentSize = getSelectedSize();
          const price = SIZE_PRICES[currentSize] || 5000;

          addToCart({
            id,
            name: p.name,
            image: p.image,
            sizeMl: currentSize,
            price
          });
        });
      });
    }

    /* -----------------------------------------
       🔹 CAMBIO DE TAMAÑO (ML)
    ------------------------------------------*/
    sizeSelector.addEventListener("change", () => {
      const ml = Number(sizeSelector.value);
      setSelectedSize(ml);
      renderProductsGrid();
    });

    // Sincronizar select con lo que ya tenga guardado el usuario
    document.addEventListener("DOMContentLoaded", () => {
      const ml = getSelectedSize();
      sizeSelector.value = String(ml);
    });
  </script>

</body>
</html>
