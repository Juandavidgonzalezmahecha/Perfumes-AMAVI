<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Perfumes - AMAVI</title>
  <link rel="icon" href="/Perfumes-AMAVI/assets/img/LOGOAMAVI.png" />
  <link href="/Perfumes-AMAVI/assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <!-- 🔸 CABECERA -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/Perfumes-AMAVI/">AMAVI</a>
      <nav class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="/Perfumes-AMAVI/">Inicio</a></li>
          <li><a href="/Perfumes-AMAVI/views/products.html" class="active">Catálogo</a></li>
          <li><a href="/Perfumes-AMAVI/views/personalizar.html">Personalizar</a></li>
          <li><a href="/Perfumes-AMAVI/views/login.html">Ingresar</a></li>
          <li>
            <a href="/Perfumes-AMAVI/views/cart.html" class="cart-link">
              🛒 <span id="cartCount" class="cart-count">0</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 CONTENIDO -->
  <main class="wrap" style="padding:60px 0;">
    <h2 class="center">Catálogo de Perfumes</h2>
    <p class="center text-muted">Explora nuestras fragancias exclusivas para cada estilo.</p>

    <div id="productGrid" class="products-grid" style="margin-top:40px;"></div>
  </main>

  <!-- 🔸 PIE DE PÁGINA -->
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🔸 SCRIPTS -->
  <script src="/Perfumes-AMAVI/assets/js/app.js"></script>
  <script>
    // Mostrar todos los productos del arreglo
    const grid = document.getElementById("productGrid");
    if (typeof perfumes !== "undefined") {
      grid.innerHTML = perfumes.map(p => `
        <div class="card">
          <img src="/Perfumes-AMAVI/assets/img/${p.image}" alt="${p.name}" />
          <h3>${p.name}</h3>
          <p class="text-muted">${p.notes}</p>
          <p class="price">$${p.price.toFixed(2)}</p>
          <div style="margin-top:12px">
            <button class="btn-primary" onclick="addToCart(${p.id})">Agregar al carrito</button>
            <a class="btn-ghost" href="/Perfumes-AMAVI/views/product.html?id=${p.id}">Ver más</a>
          </div>
        </div>
      `).join("");
    } else {
      grid.innerHTML = "<p class='center text-muted'>No hay productos disponibles.</p>";
    }

    // 🔹 Actualizar contador del carrito
    document.addEventListener("DOMContentLoaded", () => {
      const countEl = document.getElementById("cartCount");
      if (!countEl) return;
      const cart = JSON.parse(localStorage.getItem("amavi_cart") || "[]");
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      countEl.textContent = totalItems;
    });
  </script>
</body>
</html>
