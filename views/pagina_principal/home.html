<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMAVI - Home</title>
  <link rel="stylesheet" href="../../assets/css/home.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <header class="home-header">
    <div class="brand">
      <img src="../../assets/img/LOGOAMAVI.png" alt="AMAVI logo" />
      <h1>AMAVI</h1>
    </div>
    <nav class="home-nav">
      <a href="../../views/login.html">Salir</a>
      <!-- puedes agregar más enlaces -->
    </nav>
  </header>

  <main class="home-main">
    <section class="hero">
      <div class="hero-content">
        <h2>Fragancias que cuentan historias</h2>
        <p>Descubre nuestra colección exclusiva.</p>
        <a class="cta" href="#">Comprar ahora</a>
      </div>
      <div class="hero-img">
        <img src="../../assets/img/producto1.png" alt="Perfume destacado" />
      </div>
    </section>

    <section class="productos">
      <h3>Productos destacados</h3>
      <div class="grid">
        <article class="card">
          <img src="../../assets/img/producto1.png" alt="Producto 1" />
          <h4>Luxurious Elixir</h4>
          <p>$220.00</p>
        </article>
        <article class="card">
          <img src="../../assets/img/producto2.png" alt="Producto 2" />
          <h4>The Golden Legacy</h4>
          <p>$160.00</p>
        </article>
        <article class="card">
          <img src="../../assets/img/producto3.png" alt="Producto 3" />
          <h4>Luxurious Essence</h4>
          <p>$250.00</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="home-footer">
    <p>© 2025 Perfumes AMAVI</p>
  </footer>
</body>
</html>
