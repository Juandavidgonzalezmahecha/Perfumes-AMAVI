<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - AMAVI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="register-section">
      <div class="register-box">
        <h1 class="auth-title">Regístrate en AMAVI</h1>
        <p class="muted">Crea tu cuenta para continuar</p>

        <form class="register-form" method="POST">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" class="input" placeholder="Eybar Santiago Viasus Arboleda" required>

          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="input" placeholder="Amavi@gmail.com" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" class="input" placeholder="********" required>

          <label for="password-confirm">Confirmar Contraseña</label>
          <input type="password" id="password-confirm" class="input" placeholder="********" required>

          <button type="submit" class="auth-btn">REGISTRARSE</button>
        </form>

        <p class="muted">
          ¿Ya tienes cuenta?
          <a href="#login" id="go-login">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
