<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - AMAVI</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="icon" type="image/png" href="../assets/img/LOGOAMAVI.png" />
</head>
<body>
  <div class="container">
    <div class="register-section">
      <div class="register-box">
        <h1>AMAVI</h1>
        <h2>Crear Cuenta</h2>

        <form id="registerForm">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" placeholder="Eybar Santiago Viasus Arboleda" required />

          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="Amavi@gmail.com" required />

          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="********" required />

          <label for="password-confirm">Confirmar Contraseña</label>
          <input type="password" id="password-confirm" placeholder="********" required />

          <button type="submit" class="btn-register">REGISTRARSE</button>
        </form>

        <p>¿Ya tienes una cuenta? 
          <a href="login.html">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Script de registro simulado -->
  <script>
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('password-confirm').value.trim();

      if (!name || !email || !password || !confirmPassword) {
        alert('Por favor, completa todos los campos.');
        return;
      }

      if (password !== confirmPassword) {
        alert('Las contraseñas no coinciden.');
        return;
      }

      // Simula un registro exitoso
      alert(`¡Registro exitoso, ${name}! Ahora puedes iniciar sesión.`);
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
