<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <main class="center" style="padding:80px 0">
    <div style="max-width:420px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:28px;border-radius:12px;">
      <h2 class="center">Crear cuenta</h2>
      <form id="registerForm">
        <label class="text-muted">Nombre completo</label>
        <input type="text" name="name" required />
        <label class="text-muted">Email</label>
        <input type="email" name="email" required />
        <label class="text-muted">Contraseña</label>
        <input type="password" name="password" required />
        <div style="margin-top:12px;display:flex;gap:10px;justify-content:space-between;align-items:center">
          <button class="btn-primary" type="submit">Registrar</button>
          <a href="login.html" class="btn-ghost">Iniciar sesión</a>
        </div>
      </form>
    </div>
  </main>

  <!-- 🔥 Firebase Register -->
  <script type="module">
    import { auth } from "/Perfumes-AMAVI/assets/js/firebase.js";
    import {
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const form = document.getElementById('registerForm');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const name = form.name.value;
      const email = form.email.value;
      const password = form.password.value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        await updateProfile(user, { displayName: name });
        await sendEmailVerification(user);
        alert("✅ Cuenta creada correctamente. Verifica tu correo antes de iniciar sesión.");
        window.location.href = "/Perfumes-AMAVI/views/login.html";
      } catch (err) {
        alert("❌ Error al registrar: " + err.message);
      }
    });
  </script>
</body>
</html>
