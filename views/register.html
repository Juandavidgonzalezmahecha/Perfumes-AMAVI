<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - AMAVI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="register-section">
      <div class="register-box">
        <h1>Regístrate en AMAVI</h1>
        <h2>Crear Cuenta</h2>
        <form action="#" method="post">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" placeholder="Eybar Santiago Viasus Arboleda" required>

          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="Amavi@gmail.com" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="********" required>

          <label for="password-confirm">Confirmar Contraseña</label>
          <input type="password" id="password-confirm" placeholder="********" required>

          <button type="submit" class="btn-register">REGISTRARSE</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="#login">Inicia sesión</a></p>
      </div>
    </div>
  </div>
</body>
</html>
