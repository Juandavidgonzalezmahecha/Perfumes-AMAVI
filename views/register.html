<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrarse - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <!-- 🔹 NAVBAR -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-links">
            <a href="login.html" class="btn-primary">Ingresar</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔹 FORMULARIO DE REGISTRO -->
  <main class="center" style="padding:80px 0">
    <div style="max-width:420px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:28px;border-radius:12px;">
      <h2 class="center">Crear cuenta</h2>

      <form id="registerForm">
        <label class="text-muted">Nombre</label>
        <input type="text" name="name" required />

        <label class="text-muted">Email</label>
        <input type="email" name="email" required />

        <label class="text-muted">Contraseña</label>
        <input type="password" name="password" required />

        <div style="margin-top:12px;">
          <button class="btn-primary" type="submit">Registrar</button>
        </div>

        <div style="margin-top:18px" class="center">
          <button type="button" id="googleRegister" class="btn-ghost">Registrarse con Google</button>
        </div>

        <p style="margin-top:12px;font-size:14px;">
          ¿Ya tienes cuenta? <a href="login.html" style="color:var(--accent)">Inicia sesión aquí</a>.
        </p>
      </form>
    </div>
  </main>

  <!-- 🔹 SCRIPTS DE FIREBASE -->
  <script type="module">
    import {
      registerUser,
      registerWithGoogle
    } from "../assets/js/firebase.js";

    const form = document.getElementById("registerForm");
    const googleBtn = document.getElementById("googleRegister");

    // 🔸 Registro con correo y contraseña
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value.trim();

      try {
        await registerUser(name, email, password);
        alert("✅ Registro exitoso. Revisa tu correo para verificar tu cuenta.");
        window.location.href = "login.html";
      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    });

    // 🔸 Registro con Google
    googleBtn.addEventListener("click", async () => {
      try {
        await registerWithGoogle();
        alert("✅ Registro con Google exitoso");
        window.location.href = "../index.html";
      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    });
  </script>
</body>
</html>
