<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito - AMAVI</title>
  <link rel="icon" href="../assets/img/LOGOAMAVI.png" />
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- 🔸 NAVBAR -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html" class="active">🛒 Carrito (<span id="cartCount">0</span>)</a></li>
          <li><a href="login.html">Ingresar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 CONTENIDO -->
  <main class="wrap" style="padding:60px 0;">
    <h2 class="center">Tu carrito de compras</h2>
    <p class="center text-muted">Revisa tus productos antes de continuar con la compra.</p>

    <div id="cartContainer" style="margin-top:40px;"></div>

    <div class="center" style="margin-top:40px;">
      <button id="clearCart" class="btn-ghost">Vaciar carrito</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
  <script>
    const container = document.getElementById("cartContainer");
    const countEl = document.getElementById("cartCount");
    const clearBtn = document.getElementById("clearCart");

    function renderCart() {
      const cart = getCart();
      countEl.textContent = cart.reduce((a, b) => a + b.qty, 0);

      if (cart.length === 0) {
        container.innerHTML = "<p class='center text-muted'>Tu carrito está vacío.</p>";
        return;
      }

      let total = 0;
      container.innerHTML = `
        <div class="products-grid">
          ${cart.map(item => {
            total += item.price * item.qty;
            return `
              <div class="card center">
                <img src="../assets/img/p${item.id}.png" alt="${item.name}">
                <h3>${item.name}</h3>
                <p>Cantidad: ${item.qty}</p>
                <p>Precio: $${item.price.toFixed(2)}</p>
                <p>Subtotal: $${(item.price * item.qty).toFixed(2)}</p>
                <button class="btn-ghost" onclick="removeItem(${item.id})">Eliminar</button>
              </div>
            `;
          }).join("")}
        </div>
        <div class="center" style="margin-top:30px;">
          <h3>Total: $${total.toFixed(2)}</h3>
          <button class="btn-primary" onclick="alert('Compra realizada exitosamente 🎉')">Finalizar compra</button>
        </div>
      `;
    }

    function removeItem(id) {
      let cart = getCart();
      cart = cart.filter(item => item.id !== id);
      saveCart(cart);
      renderCart();
    }

    clearBtn.addEventListener("click", () => {
      saveCart([]);
      renderCart();
    });

    renderCart();
  </script>
</body>
</html>
