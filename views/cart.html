<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito - AMAVI</title>
  <link rel="icon" href="../assets/img/LOGOAMAVI.png" />
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>

<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul id="nav-links">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html" class="active">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-section"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding:80px 0;">
    <h2 class="center">Tu carrito de compras</h2>
    <p class="center text-muted">Revisa tus productos antes de continuar.</p>

    <div id="cartContainer"></div>

    <div class="center" style="margin-top:40px;">
      <button id="clearCart" class="btn-ghost">Vaciar carrito</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🔹 SCRIPT CARRITO + FIREBASE -->
  <script type="module">
    import { auth, logoutUser, db } from "../assets/js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { getCart, saveCart } from "../assets/js/app.js";
    import { ref, push, set } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const authSection = document.getElementById("auth-section");
    const cartContainer = document.getElementById("cartContainer");
    const clearBtn = document.getElementById("clearCart");

    let currentUser = null;

    /* -----------------------------------------
        🔹 CONTROL LOGIN
    ------------------------------------------*/
    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (user) {
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        authSection.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" class="user-photo">
            <span>${name}</span>
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "../index.html";
        });

      } else {
        authSection.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }
    });


    /* -----------------------------------------
        🔹 RENDER CARRITO
    ------------------------------------------*/
    function renderCart() {
      const cart = getCart();

      if (cart.length === 0) {
        cartContainer.innerHTML = "<p class='center text-muted'>Tu carrito está vacío.</p>";
        return;
      }

      let total = 0;

      cartContainer.innerHTML = `
        <div class="products-grid">
          ${cart.map(item => {
            total += item.price * item.qty;
            return `
              <div class="card center">
                <img src="${item.image}" alt="${item.name}">
                <h3>${item.name}</h3>
                <p>Cantidad: ${item.qty}</p>
                <p>Precio: $${item.price.toLocaleString()}</p>
                <p>Subtotal: $${(item.price * item.qty).toLocaleString()}</p>

                <button class="btn-ghost" onclick="removeItem('${item.id}')">Eliminar</button>
              </div>
            `;
          }).join("")}
        </div>

        <div class="center" style="margin-top:30px;">
          <h3>Total: $${total.toLocaleString()}</h3>
          <button class="btn-primary" onclick="finalizarCompra()">Finalizar compra</button>
        </div>
      `;
    }


    /* -----------------------------------------
        🔹 ELIMINAR PRODUCTO
    ------------------------------------------*/
    window.removeItem = id => {
      let cart = getCart().filter(i => i.id != id);
      saveCart(cart);
      renderCart();
    };


    /* -----------------------------------------
        🔹 FINALIZAR COMPRA (GUARDAR EN FIREBASE)
    ------------------------------------------*/
    window.finalizarCompra = async () => {
      const cart = getCart();

      if (cart.length === 0) {
        alert("Tu carrito está vacío.");
        return;
      }

      if (!currentUser) {
        alert("Debes iniciar sesión para realizar la compra.");
        window.location.href = "login.html";
        return;
      }

      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);

      const orderRef = push(ref(db, "orders"));

      const orderData = {
        userId: currentUser.uid,
        customerName: currentUser.displayName || "Cliente",
        email: currentUser.email,
        createdAt: Date.now(),
        status: "pendiente",
        total: total,
        items: {},
      };

      cart.forEach(item => {
        orderData.items[item.id] = {
          name: item.name,
          price: item.price,
          qty: item.qty,
          image: item.image
        };
      });

      await set(orderRef, orderData);

      alert("🎉 Tu pedido fue registrado con éxito.");
      saveCart([]);
      renderCart();
    };


    /* -----------------------------------------
        🔹 VACIAR CARRITO
    ------------------------------------------*/
    clearBtn.addEventListener("click", () => {
      saveCart([]);
      renderCart();
    });

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>

</body>
</html>
