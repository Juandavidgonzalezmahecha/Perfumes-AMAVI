<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personaliza tu Perfume - AMAVI</title>
  <link rel="icon" href="../assets/img/LOGOAMAVI.png" />
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>

<!-- BOTÓN DE WHATSAPP FIJO -->
<a class="whatsapp-btn" target="_blank"
href="https://wa.me/573238000910?text=Hola%2C%20estoy%20interesad%40%20en%20tus%20perfumes%2C%20me%20podrias%20brindar%20mas%20informaci%C3%B3n.">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<style>
.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25d366;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 9999;
  cursor: pointer;
}
.whatsapp-btn img {
  width: 35px;
}
</style>

<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul id="nav-links">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html" class="active">Recomendar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-section"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding:60px 0;">
    <h2 class="center">Crea tu perfume ideal</h2>
    <p class="center text-muted">Responde algunas preguntas y encuentra tu aroma perfecto.</p>

    <form id="quizForm" class="form-card" style="max-width:600px;margin:40px auto;">

      <!-- PREGUNTA: OCASIÓN -->
      <label>1️⃣ ¿A qué ocasión te presentas?</label>
      <select name="ocasion">
        <option value="dia">Día a día</option>
        <option value="noche">Noche</option>
        <option value="citas">Citas Especiales</option>
        <option value="fiestas">Fiestas y Celebraciones</option>
        <option value="trabajo">Trabajo / Oficina</option>
        <option value="deporte">Deporte / Gym</option>
        <option value="verano">Verano / Clima Cálido</option>
        <option value="invierno">Invierno / Clima Frío</option>
      </select>

      <div class="center" style="margin-top:20px;">
        <button type="submit" class="btn-primary">Recomendaciones</button>
      </div>
    </form>

    <div id="resultado" class="center" style="margin-top:40px;"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
    <p class="center text-muted" style="margin-top:20px;">&copy; 2025 Perfumes AMAVI — Todos los derechos reservados</p>
  </footer>

  <!-- FIREBASE + QUIZ -->
  <script type="module">
    import { auth, logoutUser } from "../assets/js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    const authSection = document.getElementById("auth-section");

    // ----- AUTH -----
    onAuthStateChanged(auth, user => {
      if (user) {
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        authSection.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" class="user-photo">
            <span>${name}</span>
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "../index.html";
        });
      } else {
        authSection.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }
    });

    // ----- QUIZ -----
    const form = document.getElementById("quizForm");
    const resultBox = document.getElementById("resultado");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const ocasion = form.ocasion.value;
      let msg = "AMAVI Essence — mezcla adaptada a tu estilo.";

      // Recomendaciones según ocasión
      if (ocasion === "noche")
        msg = "Recomendados: Lattafa Asad, 9pm, Valentine Born in Roma, 212 VIP Black, Ceori Pasión, Coco Chanel";
      if (ocasion === "dia")
        msg = "Recomendados: Acqua Di Gio, Cloud Ariana Grande, Lacoste Blanc, Tommy Men, Tommy Girl, Polo Blue, Ralph, Issey Miyake Men, Issey Miyake Mujer";
      if (ocasion === "citas")
        msg = "Recomendados:Good Girl, Oud For Glory, Santal 33, Erba Pura, JPG Le Male";
      if (ocasion === "fiestas")
        msg = "Recomendados: One Million, Bhaarara King, JPG Scandal Men, Invictus, Bright Crystal, Khamrah, Khamrah Qahwa";
      if (ocasion === "trabajo")
        msg = "Recomendados: Versace Eros Men, Versace Eros Energy, Versace Eros Woman (Eros pour Femme), Nautica Voyage, Dorsay";
      if (ocasion === "deporte")
        msg = "Recomendados: Acqua Di Gio, Lacoste Blanc, Nautica Voyage, Invictus";
      if (ocasion === "verano")
        msg = "Recomendados: Acqua Di Gio, Nautica Voyage, Ralph, Bright Crystal";
      if (ocasion === "invierno")
        msg = "Recomendados: Lattafa Asad, 212 VIP Black, One Million, Oud For Glory";

      resultBox.innerHTML = `
        <div class="card" style="max-width:450px;margin:auto;">
          <h3>Tu recomendación personalizada</h3>
          <p>${msg}</p>
          
        </div>
      `;
    });
  </script>

</body>
</html>
