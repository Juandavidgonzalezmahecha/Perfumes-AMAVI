<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personaliza tu Perfume - AMAVI</title>
  <link rel="icon" href="../assets/img/LOGOAMAVI.png" />
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <!-- 🔸 CABECERA -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html" class="active">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="user-info"></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 SECCIÓN DE PERSONALIZACIÓN -->
  <main class="wrap" style="padding:60px 0;">
    <h2 class="center">Crea tu perfume ideal</h2>
    <p class="center text-muted">Responde algunas preguntas y descubre la fragancia perfecta para ti.</p>

    <form id="quizForm" class="form-card" style="max-width:600px;margin:40px auto;">
      <label>1️⃣ ¿Prefieres aromas dulces o frescos?</label>
      <select name="aroma">
        <option value="dulce">Dulces</option>
        <option value="fresco">Frescos</option>
        <option value="amaderado">Amaderados</option>
      </select>

      <label>2️⃣ ¿Para qué ocasión usarías el perfume?</label>
      <select name="ocasion">
        <option value="diario">Uso diario</option>
        <option value="elegante">Eventos elegantes</option>
        <option value="noche">Salidas nocturnas</option>
      </select>

      <label>3️⃣ ¿Qué tipo de duración prefieres?</label>
      <select name="duracion">
        <option value="suave">Suave (4h)</option>
        <option value="media">Media (6h)</option>
        <option value="intensa">Intensa (8h+)</option>
      </select>

      <div class="center" style="margin-top:20px;">
        <button type="submit" class="btn-primary">Generar mi perfume</button>
      </div>
    </form>

    <div id="resultado" class="center" style="margin-top:40px;"></div>
  </main>

  <!-- 🔸 PIE DE PÁGINA -->
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes personalizados para cada esencia.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>

  <script type="module">
    import { auth } from "../assets/js/firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const userInfo = document.getElementById("user-info");

    onAuthStateChanged(auth, user => {
      if (user) {
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        userInfo.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" alt="Foto de perfil" style="width:32px;height:32px;border-radius:50%;">
            <span>${name}</span>
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await signOut(auth);
          alert("👋 Sesión cerrada");
          window.location.href = "../index.html";
        });
      } else {
        userInfo.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }
    });

    // 🔹 Lógica del formulario
    const form = document.getElementById("quizForm");
    const result = document.getElementById("resultado");

    form.addEventListener("submit", e => {
      e.preventDefault();
      const aroma = form.aroma.value;
      const ocasion = form.ocasion.value;

      let recomendacion = "";
      if (aroma === "dulce" && ocasion === "noche") recomendacion = "AMAVI Noire — vainilla, ámbar y jazmín.";
      else if (aroma === "fresco" && ocasion === "diario") recomendacion = "AMAVI Breeze — notas cítricas y florales.";
      else if (aroma === "amaderado" && ocasion === "elegante") recomendacion = "AMAVI Royal — sándalo y cedro.";
      else recomendacion = "AMAVI Essence — mezcla adaptada a tu estilo.";

      result.innerHTML = `
        <div class="card" style="max-width:500px;margin:auto;">
          <h3>Tu recomendación personalizada</h3>
          <p>${recomendacion}</p>
          <a class="btn-secondary" href="products.html">Ver perfumes similares</a>
        </div>
      `;
      form.reset();
    });
  </script>
</body>
</html>
