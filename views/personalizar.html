<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personaliza tu Perfume - AMAVI</title>
  <link rel="icon" href="/Perfumes-AMAVI/assets/img/LOGOAMAVI.png" />
  <link href="/Perfumes-AMAVI/assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- 🔸 CABECERA -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/Perfumes-AMAVI/">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="/Perfumes-AMAVI/">Inicio</a></li>
          <li><a href="/Perfumes-AMAVI/views/products.html">Catálogo</a></li>
          <li><a href="/Perfumes-AMAVI/views/personalizar.html" class="active">Personalizar</a></li>
          <li><a href="/Perfumes-AMAVI/views/login.html">Ingresar</a></li>
          <li><a href="/Perfumes-AMAVI/views/cart.html" class="cart-link">🛒 <span id="cartCount" class="cart-count">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 SECCIÓN DE PERSONALIZACIÓN -->
  <main class="wrap" style="padding:80px 0;">
    <h2 class="center">Crea tu perfume ideal</h2>
    <p class="center text-muted">Responde algunas preguntas y descubre la fragancia perfecta para ti.</p>

    <form id="quizForm" class="form-card" style="max-width:600px;margin:40px auto;">
      <label>1️⃣ ¿Prefieres aromas dulces o frescos?</label>
      <select name="aroma" required>
        <option value="dulce">Dulces</option>
        <option value="fresco">Frescos</option>
        <option value="amaderado">Amaderados</option>
      </select>

      <label>2️⃣ ¿Para qué ocasión usarías el perfume?</label>
      <select name="ocasion" required>
        <option value="diario">Uso diario</option>
        <option value="elegante">Eventos elegantes</option>
        <option value="noche">Salidas nocturnas</option>
      </select>

      <label>3️⃣ ¿Qué tipo de duración prefieres?</label>
      <select name="duracion" required>
        <option value="suave">Suave (4h)</option>
        <option value="media">Media (6h)</option>
        <option value="intensa">Intensa (8h+)</option>
      </select>

      <div class="center" style="margin-top:24px;">
        <button type="submit" class="btn-primary">Generar mi perfume</button>
      </div>
    </form>

    <div id="resultado" class="center" style="margin-top:40px;"></div>
  </main>

  <!-- 🔸 PIE DE PÁGINA -->
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes personalizados para cada esencia.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🔸 SCRIPT -->
  <script>
    const form = document.getElementById("quizForm");
    const result = document.getElementById("resultado");

    form.addEventListener("submit", e => {
      e.preventDefault();
      const aroma = form.aroma.value;
      const ocasion = form.ocasion.value;
      const duracion = form.duracion.value;

      let recomendacion = "";

      if (aroma === "dulce" && ocasion === "noche") {
        recomendacion = "🌙 <strong>AMAVI Noire</strong> — notas de vainilla, ámbar y jazmín.";
      } else if (aroma === "fresco" && ocasion === "diario") {
        recomendacion = "🌼 <strong>AMAVI Breeze</strong> — notas cítricas y florales para un día activo.";
      } else if (aroma === "amaderado" && ocasion === "elegante") {
        recomendacion = "👑 <strong>AMAVI Royal</strong> — fragancia sofisticada con toques de sándalo y cedro.";
      } else {
        recomendacion = "💫 <strong>AMAVI Essence</strong> — una mezcla equilibrada adaptada a tu estilo.";
      }

      result.innerHTML = `
        <div class="card" style="max-width:520px;margin:auto;">
          <h3>Tu recomendación personalizada</h3>
          <p>${recomendacion}</p>
          <a class="btn-secondary" href="/Perfumes-AMAVI/views/products.html">Ver perfumes similares</a>
        </div>
      `;
      form.reset();
    });
  </script>
</body>
</html>
