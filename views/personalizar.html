<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personaliza tu Perfume - AMAVI</title>
  <link rel="icon" href="../assets/img/LOGOAMAVI.png" />
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul id="nav-links">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html" class="active">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-section"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding:60px 0;">
    <h2 class="center">Crea tu perfume ideal</h2>
    <p class="center text-muted">Responde algunas preguntas y encuentra tu aroma perfecto.</p>

    <form id="quizForm" class="form-card" style="max-width:600px;margin:40px auto;">
      <label>1️⃣ ¿Prefieres aromas dulces o frescos?</label>
      <select name="aroma">
        <option value="dulce">Dulces</option>
        <option value="fresco">Frescos</option>
        <option value="amaderado">Amaderados</option>
      </select>

      <label>2️⃣ ¿Para qué ocasión usarías el perfume?</label>
      <select name="ocasion">
        <option value="diario">Uso diario</option>
        <option value="elegante">Eventos elegantes</option>
        <option value="noche">Salidas nocturnas</option>
      </select>

      <label>3️⃣ ¿Qué tipo de duración prefieres?</label>
      <select name="duracion">
        <option value="suave">Suave</option>
        <option value="media">Media</option>
        <option value="intensa">Intensa</option>
      </select>

      <div class="center" style="margin-top:20px;">
        <button type="submit" class="btn-primary">Generar mi perfume</button>
      </div>
    </form>

    <div id="resultado" class="center" style="margin-top:40px;"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes personalizados para cada esencia.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <script type="module">
    import { auth, logoutUser } from "../assets/js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    const authSection = document.getElementById("auth-section");

    onAuthStateChanged(auth, user => {
      if (user) {
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        authSection.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" class="user-photo">
            <span>${name}</span>
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "../index.html";
        });
      } else {
        authSection.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }
    });

    // 🔹 LÓGICA DEL QUIZ (versión básica)
    const form = document.getElementById("quizForm");
    const resultBox = document.getElementById("resultado");

    form.addEventListener("submit", e => {
      e.preventDefault();

      const aroma = form.aroma.value;
      const ocasion = form.ocasion.value;

      let msg = "AMAVI Essence — mezcla adaptada a tu estilo.";

      if (aroma === "dulce" && ocasion === "noche") msg = "Fantasy / Good Girl / Cloud Ariana";
      if (aroma === "fresco" && ocasion === "diario") msg = "Ralph / Tommy Girl / Bright Crystal";
      if (aroma === "amaderado" && ocasion === "elegante") msg = "Oud For Glory / Asad / Erba Pura";

      resultBox.innerHTML = `
        <div class="card" style="max-width:450px;margin:auto;">
          <h3>Tu recomendación personalizada</h3>
          <p>${msg}</p>
          <a class="btn-secondary" href="products.html">Ver perfumes sugeridos</a>
        </div>
      `;
    });
  </script>

</body>
</html>
