<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del Administrador - AMAVI</title>
  <link rel="icon" href="/Perfumes-AMAVI/assets/img/LOGOAMAVI.png" />
  <link href="/Perfumes-AMAVI/assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- 🔸 NAVBAR -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/Perfumes-AMAVI/">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="/Perfumes-AMAVI/">Inicio</a></li>
          <li><a href="/Perfumes-AMAVI/views/products.html">Catálogo</a></li>
          <li><a href="/Perfumes-AMAVI/views/personalizar.html">Personalizar</a></li>
          <li><a href="/Perfumes-AMAVI/views/admin.html" class="active">Administrador</a></li>
          <li><a href="/Perfumes-AMAVI/views/cart.html" class="cart-link">🛒 <span id="cartCount" class="cart-count">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 CONTENIDO -->
  <main class="wrap" style="padding:80px 0;">
    <h2 class="center">Panel del Administrador</h2>
    <p class="center text-muted">Gestiona los productos del catálogo</p>

    <!-- 🟢 FORMULARIO PARA NUEVO PRODUCTO -->
    <section class="form-card" style="max-width:600px;margin:40px auto;">
      <h3>Agregar nuevo perfume</h3>
      <form id="addProductForm">
        <label>Nombre</label>
        <input name="name" required />
        <label>Descripción</label>
        <input name="notes" required />
        <label>Precio</label>
        <input type="number" name="price" step="0.01" required />
        <label>Nombre de imagen (ej: p1.png)</label>
        <input name="image" required />
        <div class="center" style="margin-top:16px;">
          <button type="submit" class="btn-primary">Agregar producto</button>
        </div>
      </form>
    </section>

    <!-- 🟣 LISTA DE PRODUCTOS -->
    <section style="margin-top:60px;">
      <h3 class="center">Productos actuales</h3>
      <div id="adminProducts" class="products-grid" style="margin-top:30px;"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Panel administrativo para gestión de perfumes.</p>
      </div>
      <div>
        <h5>Soporte</h5>
        <p>admin@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🔸 SCRIPT -->
  <script src="/Perfumes-AMAVI/assets/js/app.js"></script>
  <script>
    const adminGrid = document.getElementById("adminProducts");
    const form = document.getElementById("addProductForm");

    // Cargar productos existentes
    function renderAdminProducts() {
      const allPerfumes = getPerfumes();
      adminGrid.innerHTML = allPerfumes.map((p, index) => `
        <div class="product-card">
          <img src="/Perfumes-AMAVI/assets/img/${p.image}" alt="${p.name}" />
          <h3>${p.name}</h3>
          <p>${p.notes}</p>
          <p class="price">$${p.price.toFixed(2)}</p>
          <div style="margin-top:10px;">
            <button class="btn-ghost" onclick="deleteProduct(${index})">Eliminar</button>
          </div>
        </div>
      `).join("");
    }

    // Obtener lista actual de perfumes (de localStorage o base)
    function getPerfumes() {
      return JSON.parse(localStorage.getItem("amavi_perfumes") || JSON.stringify(perfumes));
    }

    // Guardar perfumes actualizados
    function savePerfumes(list) {
      localStorage.setItem("amavi_perfumes", JSON.stringify(list));
    }

    // Agregar nuevo perfume
    form.addEventListener("submit", e => {
      e.preventDefault();
      const newProduct = {
        id: Date.now(),
        name: form.name.value,
        notes: form.notes.value,
        price: parseFloat(form.price.value),
        image: form.image.value
      };
      const current = getPerfumes();
      current.push(newProduct);
      savePerfumes(current);
      form.reset();
      renderAdminProducts();
      alert("✅ Producto agregado correctamente");
    });

    // Eliminar perfume
    function deleteProduct(index) {
      const list = getPerfumes();
      list.splice(index, 1);
      savePerfumes(list);
      renderAdminProducts();
      alert("🗑️ Producto eliminado");
    }

    renderAdminProducts();
  </script>
</body>
</html>
