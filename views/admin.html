<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrador - AMAVI</title>

  <link rel="icon" href="../assets/img/LOGOAMAVI.png" />
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../index.html">AMAVI</a>
    <nav class="main-nav">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="products.html">Catálogo</a></li>
        <li><a href="personalizar.html">Personalizar</a></li>
        <li><a class="active" href="admin.html">Admin</a></li>
        <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap" style="padding:32px 0;">

  <h2 class="center">Panel del Administrador</h2>

  <div class="admin-grid" style="margin-top:24px;">

    <!-- LEFT -->
    <section class="admin-panel">
      <h3>Agregar / Editar producto</h3>
      <form id="productForm">
        <input type="hidden" id="editId">

        <label>Nombre</label>
        <input id="p-name" required>

        <label>Descripción</label>
        <input id="p-notes" required>

        <label>Tipo</label>
        <input id="p-type" required>

        <label>Precio</label>
        <input id="p-price" type="number" required>

        <label>URL Imagen</label>
        <input id="p-image" required>

        <label>Stock (JSON)</label>
        <input id="p-stock">

        <button class="btn-primary" type="submit">Guardar</button>
        <button class="btn-ghost" id="resetFormBtn" type="button">Limpiar</button>
      </form>
    </section>

    <section class="admin-panel">
      <h3>Buscar</h3>
      <input id="searchAdmin" placeholder="Buscar productos...">
      <select id="filterType">
        <option value="all">Todos</option>
        <option value="dulce">Dulce</option>
        <option value="fresco">Fresco</option>
        <option value="amaderado">Amaderado</option>
      </select>

      <div id="productsList" class="row"></div>
    </section>

    <section class="admin-panel">
      <h3>Pedidos recientes</h3>
      <div id="ordersList"></div>
    </section>

    <!-- RIGHT -->
    <aside class="admin-panel">
      <h3>Panel rápido</h3>
      <p>Admin: <strong id="adminName">—</strong></p>
      <p>Email: <strong id="adminEmail">—</strong></p>
      <hr>
      <p>Productos: <strong id="statProducts">0</strong></p>
      <p>Pedidos: <strong id="statOrders">0</strong></p>
      <p>Ventas: <strong id="statRevenue">$0</strong></p>
      <button id="refreshBtn" class="btn-secondary">Refrescar</button>
      <button id="logoutBtn" class="btn-ghost">Salir</button>
    </aside>

  </div>

</main>

<footer class="site-footer"></footer>

<script type="module" src="../assets/js/admin.js"></script>

</body>
</html>
