<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <main class="center" style="padding:80px 0">
    <div style="max-width:420px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:28px;border-radius:12px;">
      <h2 class="center">Ingresar</h2>
      <form id="loginForm">
        <label class="text-muted">Email</label>
        <input type="email" name="email" required />
        <label class="text-muted">Contraseña</label>
        <input type="password" name="password" required />
        <div style="margin-top:12px;display:flex;gap:10px;justify-content:space-between;align-items:center">
          <button class="btn-primary" type="submit">Entrar</button>
          <a href="register.html" class="btn-ghost">Registrarse</a>
        </div>
        <div style="margin-top:10px">
          <a href="#" id="forgot" class="text-muted">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </div>
  </main>

  <!-- 🔥 Firebase Login -->
  <script type="module">
    import { auth } from "/Perfumes-AMAVI/assets/js/firebase.js";
    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const form = document.getElementById('loginForm');
    const forgot = document.getElementById('forgot');

    // 🔹 Iniciar sesión con correo y contraseña
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = form.email.value;
      const password = form.password.value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        if (!user.emailVerified) {
          alert("⚠️ Debes verificar tu correo electrónico antes de iniciar sesión.");
          return;
        }
        alert(`¡Bienvenido ${user.displayName || user.email}!`);
        window.location.href = "/Perfumes-AMAVI/index.html";
      } catch (err) {
        alert("❌ Error al iniciar sesión: " + err.message);
      }
    });

    // 🔹 Recuperar contraseña
    forgot.addEventListener('click', async e => {
      e.preventDefault();
      const email = prompt("Introduce tu correo electrónico para restablecer tu contraseña:");
      if (!email) return;
      try {
        await sendPasswordResetEmail(auth, email);
        alert("📩 Se envió un enlace de recuperación a tu correo.");
      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    });

    // 🔹 Login con Google
    const googleBtn = document.createElement("button");
    googleBtn.textContent = "Ingresar con Google";
    googleBtn.className = "btn-primary";
    googleBtn.style.width = "100%";
    googleBtn.style.marginTop = "15px";
    form.after(googleBtn);

    googleBtn.addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
        alert("✅ Sesión iniciada con Google");
        window.location.href = "/Perfumes-AMAVI/index.html";
      } catch (err) {
        alert("❌ Error al iniciar sesión con Google: " + err.message);
      }
    });
  </script>
</body>
</html>
