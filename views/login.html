<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - AMAVI</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="login-section">
      <div class="login-box">
        <h1>AMAVI</h1>
        <p>Bienvenido</p>

        <form class="login-form" action="#" method="POST">
          <label for="email">Correo</label>
          <input class="input" type="email" id="email" name="email" placeholder="Amavi@gmail.com" required>

          <label for="password">Contraseña</label>
          <input class="input" type="password" id="password" name="password" placeholder="********" required>

          <a href="#">¿Olvidó su contraseña?</a>
          <button type="submit" class="btn-login">INGRESAR</button>
        </form>

        <p>¿No tiene una cuenta? <a href="register.html">Registrarse</a></p>
      </div>
    </div>

    <div class="illustration-section">
      <div class="illustration">
        <!-- ruta relativa correcta desde /views -->
        <img src="../assets/img/LOGOAMAVI.png" alt="logo de amavi" />
      </div>
    </div>
  </div>

  <!-- Incluye el script general (usa ../ porque estamos en /views) -->
  <script src="../assets/js/app.js"></script>
</body>
</html>
