<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AMAVI</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="icon" type="image/png" href="../assets/img/LOGOAMAVI.png" />
</head>
<body>
  <div class="container">
    <!-- Sección de login -->
    <div class="login-section">
      <div class="login-box">
        <h1>AMAVI</h1>
        <p>Bienvenido</p>

        <form class="login-form" id="loginForm">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" placeholder="Amavi@gmail.com" required />

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="********" required />

          <a href="#">¿Olvidó su contraseña?</a>

          <button type="submit" class="btn-login">INGRESAR</button>
        </form>

        <p>¿No tiene una cuenta? 
          <a href="register.html">Registrarse</a>
        </p>
      </div>
    </div>

    <!-- Sección de ilustración -->
    <div class="illustration-section">
      <div class="illustration">
        <img src="../assets/img/LOGOAMAVI.png" alt="Logo de AMAVI" />
      </div>
    </div>
  </div>

  <!-- Script para redirección simulada -->
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      
      // Aquí podrías validar credenciales reales, pero por ahora solo redirigimos
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (email && password) {
        // Simula un login exitoso
        alert('Inicio de sesión exitoso. Bienvenido a AMAVI.');
        window.location.href = 'home.html';
      } else {
        alert('Por favor, complete todos los campos.');
      }
    });
  </script>
</body>
</html>
