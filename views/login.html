<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-links">
            <a href="login.html" class="btn-primary">Ingresar</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="center" style="padding:80px 0">
    <div style="max-width:420px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:28px;border-radius:12px;">
      <h2 class="center">Ingresar</h2>

      <form id="loginForm">
        <label class="text-muted">Email</label>
        <input type="email" name="email" required />
        <label class="text-muted">Contraseña</label>
        <input type="password" name="password" required />

        <div style="margin-top:12px;display:flex;gap:10px;justify-content:space-between;align-items:center">
          <button class="btn-primary" type="submit">Entrar</button>
          <a href="register.html" class="btn-ghost">Registrarse</a>
        </div>

        <div style="margin-top:18px" class="center">
          <button type="button" id="googleBtn" class="btn-ghost">Iniciar con Google</button>
        </div>

        <p style="margin-top:12px;font-size:14px;">
          <a href="#" id="forgotLink" style="color:var(--accent)">¿Olvidaste tu contraseña?</a>
        </p>
      </form>
    </div>
  </main>

  <script type="module">
    import { auth } from "../assets/js/firebase.js";
    import {
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const form = document.getElementById('loginForm');
    const googleBtn = document.getElementById('googleBtn');
    const forgotLink = document.getElementById('forgotLink');

    // 🔹 Inicio de sesión con email
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = form.email.value;
      const password = form.password.value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert('✅ Sesión iniciada correctamente');
        window.location.href = '../index.html';
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    });

    // 🔹 Inicio con Google
    googleBtn.addEventListener('click', async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        alert('✅ Sesión iniciada con Google');
        window.location.href = '../index.html';
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    });

    // 🔹 Recuperar contraseña
    forgotLink.addEventListener('click', async e => {
      e.preventDefault();
      const email = prompt('Ingresa tu correo para restablecer la contraseña:');
      if (email) {
        try {
          await sendPasswordResetEmail(auth, email);
          alert('📩 Se envió un enlace para restablecer tu contraseña.');
        } catch (error) {
          alert('❌ Error: ' + error.message);
        }
      }
    });
  </script>
</body>
</html>
