<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AMAVI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="login-section">
      <div class="login-box">
        <h1 class="auth-title">AMAVI</h1>
        <p class="muted">Bienvenido</p>

        <form class="login-form" method="POST">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" placeholder="Amavi@gmail.com" class="input" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="********" class="input" required>

          <a href="#" class="forgot">¿Olvidó su contraseña?</a>
          <button type="submit" class="auth-btn">INGRESAR</button>
        </form>

        <p class="muted">
          ¿No tiene una cuenta? 
          <a href="#register" id="go-register">Registrarse</a>
        </p>
      </div>
    </div>

    <div class="illustration-section">
      <div class="illustration">
        <img src="assets/img/LOGOAMAVI.png" alt="logo de AMAVI">
      </div>
    </div>
  </div>
</body>
</html>
