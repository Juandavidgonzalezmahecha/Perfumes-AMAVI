<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle de Perfume - AMAVI</title>
  <link href="../assets/css/style.css" rel="stylesheet" />
</head>
<!-- BOTÓN DE WHATSAPP FIJO -->
<a class="whatsapp-btn" target="_blank"
   href="https://wa.me/573238000910">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<style>
.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25d366;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 9999;
  cursor: pointer;
}
.whatsapp-btn img {
  width: 35px;
}
</style>

<body>

  <!-- 🔸 HEADER -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">AMAVI</a>
      <nav class="main-nav">
        <ul id="nav-links">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="products.html">Catálogo</a></li>
          <li><a href="personalizar.html">Personalizar</a></li>
          <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
          <li id="auth-section"></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 DETALLE DEL PRODUCTO -->
  <main class="container" style="padding:60px 0;">
    <div id="productDetail"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <script type="module">
    import { auth, db, logoutUser } from "../assets/js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    import { addToCart } from "../assets/js/app.js";

    const authSection = document.getElementById("auth-section");
    const detailBox = document.getElementById("productDetail");

    // 🔸 LOGIN SHOW
    onAuthStateChanged(auth, user => {
      if (user) {
        const name = user.displayName || "Usuario";
        const photo = user.photoURL || "../assets/img/user.png";

        authSection.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${photo}" class="user-photo">
            <span>${name}</span>
            <button id="logoutBtn" class="btn-ghost">Salir</button>
          </div>
        `;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "../index.html";
        });

      } else {
        authSection.innerHTML = `<a href="login.html" class="btn-primary">Ingresar</a>`;
      }
    });

    // 🔸 LEER ID DE LA URL
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id");

    if (!productId) {
      detailBox.innerHTML = "<p class='center text-muted'>Producto no encontrado.</p>";
    } else {
      loadProduct(productId);
    }

    // 🔥 CARGAR DESDE REALTIME DATABASE
    async function loadProduct(id) {
      const snap = await get(ref(db, "products/" + id));

      if (!snap.exists()) {
        detailBox.innerHTML = "<p class='center text-muted'>Producto no encontrado.</p>";
        return;
      }

      const p = snap.val();

      detailBox.innerHTML = `
        <div class="product-detail-card">
          <img src="${p.image}" alt="${p.name}">
          <div class="product-info">
            <h2>${p.name}</h2>
            <p class="text-muted">${p.notes}</p>
            <p style="margin-top:10px;font-size:18px;">
              Precio: <strong>$${Number(p.price).toLocaleString()}</strong>
            </p>

            <button class="btn-primary"
              onclick='addToCart(${JSON.stringify({ id, ...p })})'>
              Agregar al carrito
            </button>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
