<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle de Perfume - AMAVI</title>
  <link rel="icon" href="/Perfumes-AMAVI/assets/img/LOGOAMAVI.png" />
  <link href="/Perfumes-AMAVI/assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- 🔸 CABECERA -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/Perfumes-AMAVI/">AMAVI</a>
      <nav class="main-nav">
        <ul>
          <li><a href="/Perfumes-AMAVI/">Inicio</a></li>
          <li><a href="/Perfumes-AMAVI/views/products.html" class="active">Catálogo</a></li>
          <li><a href="/Perfumes-AMAVI/views/personalizar.html">Personalizar</a></li>
          <li><a href="/Perfumes-AMAVI/views/login.html">Ingresar</a></li>
          <li>
            <a href="/Perfumes-AMAVI/views/cart.html" class="cart-link">
              🛒 <span id="cartCount" class="cart-count">0</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 🔸 CONTENIDO PRINCIPAL -->
  <main class="wrap" style="padding:60px 0;">
    <div id="productDetail" class="center"></div>
  </main>

  <!-- 🔸 PIE DE PÁGINA -->
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <h4>AMAVI</h4>
        <p>Perfumes artesanales y personalizados.</p>
      </div>
      <div>
        <h5>Contacto</h5>
        <p>hola@amavi.com</p>
      </div>
    </div>
  </footer>

  <!-- 🔸 SCRIPTS -->
  <script src="/Perfumes-AMAVI/assets/js/app.js"></script>
  <script>
    // Obtener ID del perfume desde la URL
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));
    const product = perfumes.find(p => p.id === id);
    const detail = document.getElementById("productDetail");

    if (product) {
      detail.innerHTML = `
        <div class="card center" style="max-width:480px;margin:auto;">
          <img src="/Perfumes-AMAVI/assets/img/${product.image}" alt="${product.name}" />
          <h2>${product.name}</h2>
          <p class="text-muted">${product.notes}</p>
          <p>Precio: <strong>$${product.price.toFixed(2)}</strong></p>
          <button class="btn-primary" onclick="addToCart(${product.id})">Agregar al carrito</button>
          <a class="btn-ghost" href="/Perfumes-AMAVI/views/products.html" style="display:block;margin-top:12px;">Volver al catálogo</a>
        </div>
      `;
    } else {
      detail.innerHTML = "<p class='center text-muted'>Producto no encontrado.</p>";
    }

    // 🔹 Actualizar contador del carrito
    document.addEventListener("DOMContentLoaded", () => {
      const countEl = document.getElementById("cartCount");
      if (!countEl) return;
      const cart = JSON.parse(localStorage.getItem("amavi_cart") || "[]");
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      countEl.textContent = totalItems;
    });
  </script>
</body>
</html>
